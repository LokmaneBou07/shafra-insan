title:"كيمياء الحب",desc:"من أول نظرة إلى أول خفقة",episodes:[Q("ماذا يحدث في دماغك عندما تحب؟","\uD83E\uDDE0","6 دقائق","حين تعجب بشخص ما، لا يخفق قلبك وحده؛ بل يعمل دماغك كله مثل أوركسترا صغيرة.",["يُفعّل الدماغ مناطق المكافأة، فيشعر الإنسان بسعادة تشبه سعادة تحقيق هدف جميل. لذلك تبدو الأيام أخفّ، والابتسامة أقرب.","يرتفع الانتباه والتركيز، فتتذكر التفاصيل الصغيرة: كلمة طيبة، موقف لطيف، ابتسامة عابرة. هذا ليس ضعفاً، بل يقظة عاطفية طبيعية.","يزيد الحماس للتعلم والتطور. كثير من المراهقين يكتشفون أن مشاعرهم تدفعهم ليكونوا أفضل في دراستهم وأخلاقهم.","في الوقت نفسه، قد يصعب النوم أو يقلّ التركيز. هذه استجابة مؤقتة، وتعود الأمور إلى توازنها مع الهدوء والتنظيم.","السرّ الجميل: الحب الناضج لا يلغي عقلك، بل يحترمه. اسأل نفسك دائماً: هل هذا الشعور يجعلني ألطف وأصدق؟","إذا كانت الإجابة نعم، فأنت أمام مشاعر يمكن أن تتحول إلى دافع للخير، لا إلى إزعاج للآخرين."],["تتعلّم فهم مشاعرك بدل كبتها","تصبح أكثر لطفاً وانتباهاً","تكتشف قيم الاحترام والصدق"],["التشتت عن الدراسة إذا لم تنظّم وقتك","المبالغة في تفسير كل نظرة أو كلمة"],"\uD83D\uDCA1 تلميح: اكتب مشاعرك في دفتر خاص. الكتابة تهدّئ القلب وتوضّح الفكرة."),Q("الدوبامين والأوكسيتوسين: هرمونا السعادة والثقة","✨","5 دقائق","الدوبامين يمنحك الحماس، والأوكسيتوسين يمنحك شعور الأمان. معاً يصنعان دفئاً خاصاً.",["الدوبامين هو هرمون التحفيز. عندما يحدث شيء جميل، يقول الدماغ: هذا ممتع، فلنكرره. لذلك نحب اللقاءات اللطيفة والكلام الطيب.","الأوكسيتوسين يظهر مع الثقة والعناق الآمن والصداقة الصادقة. إنه هرمون القرب الذي يجعلنا نشعر أننا لسنا وحدنا.","عندما يجتمع الهرمونان، نشعر بالفرح والاطمئنان. لكن التوازن مهم: الحماس وحده بلا احترام قد يتحول إلى اندفاع.","أجمل مصدر طبيعي لهما هو الكلام الصادق، والرياضة، والضحك مع الأصدقاء، ومساعدة الآخرين.","لذلك لا تحتاج إلى إثارة كبيرة لتشعر بالسعادة. موقف صغير محترم قد يكفي ليمتلئ يومك نوراً.","تذكّر: قيمتك لا تُقاس باهتمام أحد بك، بل بأخلاقك ولطفك مع نفسك ومع الناس."],["حماس صحي يدفعك للنجاح","شعور بالأمان مع الأشخاص الطيبين","طاقة إيجابية للمذاكرة والرياضة"],["البحث عن السعادة في الآخرين فقط","إهمال النوم والأكل بسبب الانشغال"],"\uD83D\uDCA1 تلميح: مارس رياضة تحبها 20 دقيقة. جسمك سيمنحك سعادة طبيعية وهدوءاً حقيقياً.")]},{title:"لغة القلب",desc:"العيون، والخجل، والفراشات",episodes:[Q("لغة العيون والنظرات","\uD83D\uDC40","5 دقائق","العين تنقل مشاعر كثيرة قبل أن تتكلم الكلمات. لكنها لغة تحتاج إلى أدب وفهم.",["عندما نرى شيئاً جميلاً، تتسع حدقة العين قليلاً، ويرتفع الحاجبان أحياناً دون أن نشعر. هذه استجابة طبيعية للدهشة والإعجاب.","التواصل البصري المحترم يبني الثقة. النظر بهدوء أثناء الحديث يقول: أنا أستمع إليك وأحترمك.","لكن النظرات الطويلة قد تُحرج الآخرين. الأدب الحقيقي هو أن تعرف متى تنظر ومتى تبتسم وتمضي.","الابتسامة الصادقة تصل أسرع من أي كلمة. ابتسامة لطيفة في المدرسة أو في الطريق قد تُدخل السرور على قلب إنسان.","إذا شعرت بالخجل، فهذا طبيعي جداً. الخجل ليس عيباً، بل علامة على قلب حساس يعرف قيمة الحياء.","الخلاصة: دع عينيك تتكلمان باللطف، لا بالفضول. الاحترام هو أجمل لغة في العالم."],["تفهم مشاعر الآخرين أكثر","تتعلم التواصل الهادئ والمحترم","تبتسم بثقة أكبر"],["التحديق قد يُزعج الآخرين","تفسير النظرات بشكل مبالغ فيه"],"\uD83D\uDCA1 تلميح: درّب نفسك على الابتسامة والتحية اللطيفة. إنها أقوى من ألف نظرة."),Q("الفراشات في المعدة: لماذا نشعر بها؟","\uD83E\uDD8B","4 دقائق","ذلك الشعور الغريب في البطن قبل لقاء مهم… إنه علم، وليس سحراً فقط.",["عند التوتر الجميل، يفرز الجسم الأدرينالين، فيزيد خفقان القلب وتشعر بحركة غريبة في معدتك.","الجهاز العصبي يربط بين الدماغ والمعدة بخيوط دقيقة، لذلك تتأثر معدتك حين تتأثر مشاعرك.","هذا الشعور يظهر أيضاً قبل الامتحان أو المباراة أو أول عرض أمام الصف. إنه علامة أن ما تفعله يهمّك.","التنفس البطيء يهدّئ الفراشات: خذ نفساً عميقاً من أنفك، وأخرجه بهدوء من فمك أربع مرات.","الابتسامة والماء والحديث مع صديق موثوق يخففون التوتر بسرعة.","لا تخف من الفراشات. هي تقول لك: قلبك حيّ، وأنت تستعد لشيء جميل."],["تعرف أن جسدك يستجيب لمشاعرك","تتعلم تهدئة نفسك بالتنفس","تصبح أشجع في المواقف الجديدة"],["قد تشعر بالغثيان إذا زاد التوتر","الخوف من أن يلاحظ الآخرون خجلك"],"\uD83D\uDCA1 تلميح: قبل أي موقف صعب، تنفّس ببطء وقل لنفسك: أنا مستعد، وسأكون لطيفاً مع نفسي.")]}]},{id:"astro",title:"علم الفلك",desc:"نجوم تلمع، وثقوب سوداء، وكواكب تدور في رقصة كونية مدهشة.",emoji:"\uD83C\uDF0C",grad:"linear-gradient(135deg,#0b1030,#2b1a5e 50%,#4c1d95)",tags:["نجوم","كواكب","كون"],parts:[{title:"حياة النجوم",desc:"من أول وميض إلى آخر ضوء",episodes:[Q("لماذا تلمع النجوم؟","⭐","6 دقائق","النجوم لا ترمش حقاً. ما تراه هو رقصة الضوء في سماء الأرض.",["النجم كرة غاز ضخمة تشتعل بالاندماج النووي، وترسل ضوءاً يسافر سنوات ليصل إلينا.","عندما يدخل هذا الضوء غلاف الأرض الجوي، يتكسر قليلاً بسبب الهواء المتحرك، فيبدو لنا وكأنه يلمع.","لذلك تلمع النجوم أكثر من الكواكب، لأن الكواكب أقرب إلينا وتبدو كقرص صغير لا يتأثر كثيراً.","لون النجم يخبرنا بحرارته: الأزرق أشد حرارة، والأحمر أبرد نسبياً. كل لون حكاية فيزيائية جميلة.","في الليالي الصافية بعيداً عن أضواء المدينة، يمكنك أن ترى مئات النجوم. السماء هناك تبدو ككتاب مفتوح.","في المرة القادمة التي تنظر فيها إلى السماء، تذكّر أنك ترى ماضياً بعيداً: ضوءاً انطلق قبل سنوات طويلة."],["تفهم فيزياء الضوء والغلاف الجوي","تتعلم الصبر والتأمل في السماء","شغف حقيقي بعلم الفلك"],["قد تحتاج إلى مكان مظلم لرؤية النجوم","الخلط بين النجوم والكواكب والأقمار الصناعية"],"\uD83D\uDCA1 تلميح: حمّل خريطة سماء بسيطة، وجرّب تمييز كوكب المشتري والزهرة في المساء."),Q("حياة النجم: من الولادة إلى الوداع","\uD83C\uDF1F","6 دقائق","كل نجم له قصة: يولد من غبار، ويعيش مليارات السنين، ثم يتحول إلى شكل جديد.",["يولد النجم داخل سحابة غاز وغبار باردة، تنكمش ببطء بفعل الجاذبية حتى تشتعل.","يعيش النجم معظم حياته وهو يحرق الهيدروجين، فيتوازن بين الجاذبية التي تضغطه والحرارة التي تدفعه للخارج.","النجوم الصغيرة مثل شمسنا تنتهي بهدوء، وتتحول إلى قزم أبيض صغير كثيف.","النجوم الضخمة تنفجر في حدث مذهل يسمى المستعر الأعظم، وتنثر عناصرها في الكون.","من هذا الغبار النجمي وُلدت الكواكب، وربما وُلدت عناصر في أجسامنا. نحن حقاً أبناء النجوم.","عندما تنظر إلى السماء، أنت تنظر إلى مصنع الحياة الكوني."],["فهم عميق لتاريخ الكون","إحساس بالدهشة والتواضع","حبّ العلوم والفيزياء"],["الأرقام الفلكية قد تبدو ضخمة ومربكة","صعوبة تخيّل مليارات السنين"],"\uD83D\uDCA1 تلميح: ارسم دورة حياة النجم في دفترك. الرسم يجعل المعلومة تبقى في ذاكرتك.")]},{title:"أعماق الكون",desc:"ثقوب سوداء وكواكب جيراننا",episodes:[Q("الثقوب السوداء: وحوش لطيفة؟","\uD83D\uDD73️","7 دقائق","الثقب الأسود ليس ثقباً حقيقياً، بل نجم انهار على نفسه حتى أصبحت جاذبيته هائلة.",["عندما يموت نجم ضخم جداً، تنهار مادته إلى نقطة صغيرة كثيفة، وتصبح جاذبيته قوية لدرجة أن الضوء لا يستطيع الهروب منها.","المنطقة التي لا يعود منها الضوء تسمى أفق الحدث. ما وراءها لا نراه، لكننا نرى أثرها على النجوم والغاز حولها.","الثقوب السوداء لا تبتلع كل شيء كما في الأفلام. إذا ابتعدت عنها مسافة آمنة، يمكنك أن تدور حولها مثل أي نجم.","في مركز مجرتنا درب التبانة يوجد ثقب أسود ضخم اسمه القوس أ*. إنه بعيد جداً، ولا يشكل خطراً علينا.","العلماء يرصدون الثقوب السوداء من خلال الضوء المنبعث من الغاز الساخن الذي يدور حولها بسرعة هائلة.","كلما عرفنا أكثر عنها، فهمنا أكثر كيف تعمل الجاذبية والزمان والمكان."],["تكشف أسرار الجاذبية والزمن","تحفّز الخيال العلمي والتفكير","تثبت أن الكون أغرب من الخيال"],["قد تسبب الخوف عند من يظنها قريبة","صعوبة تخيّل مفاهيم مثل أفق الحدث"],"\uD83D\uDCA1 تلميح: شاهد وثائقياً قصيراً عن الثقوب السوداء، ودوّن ثلاثة أسئلة تريد أن تبحث عن إجابتها."),Q("المجموعة الشمسية: جيراننا الكواكب","\uD83E\uDE90","6 دقائق","ثمانية كواكب تدور حول شمسنا في نظام دقيق، لكل واحد شخصية مختلفة.",["عطارد الأقرب إلى الشمس، صغير وسريع، ويومه طويل جداً. أما الزهرة فهي الأجمل لمعاناً، وتدور عكس بقية الكواكب تقريباً.","الأرض هي كوكبنا الوحيد المعروف الذي يحمل الحياة، بفضل الماء والهواء والمسافة المثالية من الشمس.","المريخ أحمر اللون، وفيه أكبر بركان في المجموعة الشمسية، ويحلم العلماء بزيارته يوماً ما.","المشتري عملاق الغاز، وزحل مشهور بحلقاته الجميلة، وأورانوس ونبتون بعيدان وباردان وغامضان.","كل الكواكب تدور حول الشمس لأن جاذبيتها تمسك بها، مثلما تمسك الأم أيدي أطفالها في نزهة.","عندما تتأمل هذا النظام، تشعر أن الكون ليس فوضى، بل لوحة منظمة بدقة مدهشة."],["تتعرف على جيرانك في الفضاء","تفهم لماذا الأرض مميزة","شغف بالاستكشاف والرحلات الفضائية"],["حفظ أسماء الكواكب قد يحتاج تكراراً","الخلط بين الكواكب والنجوم في السماء"],"\uD83D\uDCA1 تلميح: اصنع نموذجاً صغيراً للمجموعة الشمسية بالكرات الورقية، وعلّقه في غرفتك.")]}]},{id:"psych",title:"علم النفس",desc:"كيف تفهم مشاعرك، وتتعامل مع الرفض والحزن، وتبني ثقتك بنفسك.",emoji:"\uD83E\uDDE0",grad:"linear-gradient(135deg,#0f2a1e,#166534 50%,#22c98a)",tags:["مشاعر","ثقة","هدوء"],parts:[{title:"مشاعرك قوة",desc:"الرفض والحزن والشفاء",episodes:[Q("التعامل مع الرفض والحزن","\uD83D\uDC94","6 دقائق","الرفض مؤلم، لكنه ليس نهاية القصة. إنه درس يقول لك: طريق آخر أجمل ينتظرك.",["عندما يُرفض طلبك أو تُرفض صداقتك، يشعر الدماغ بألم حقيقي، لأن الإنسان بطبيعته يحب الانتماء.","أول خطوة هي الاعتراف: قل لنفسك أنا حزين، وهذا طبيعي. لا تخجل من مشاعرك ولا تخفها.","لا تجعل الرفض تعريفاً لك. رُفضت فكرة أو موقف، ولم تُرفض قيمتك كإنسان.","تحدث مع شخص تثق به، أو اكتب ما تشعر به. التعبير يخفف الحمل عن قلبك بشكل كبير.","حوّل الألم إلى تعلّم: ما الذي يمكن أن أطوره؟ وما الذي يجب أن أتركه وأمضي؟","مع الوقت، ستنظر إلى الوراء وتقول: شكراً لذلك الرفض، فقد قادني إلى مكان أفضل."],["تصبح أقوى وأكثر نضجاً","تتعلم اختيار علاقات صحية","تكتشف مواهب جديدة في نفسك"],["الانغلاق على النفس لفترة طويلة","مقارنة نفسك بالآخرين باستمرار"],"\uD83D\uDCA1 تلميح: عندما تحزن، افعل شيئاً لطيفاً لنفسك: امشِ، ارسم، أو تحدث مع صديق."),Q("الثقة بالنفس: تبدأ بخطوة صغيرة","\uD83D\uDCAA","5 دقائق","الثقة ليست موهبة تولد معك، بل مهارة تُبنى كل يوم بخطوات صغيرة.",["الثقة لا تعني أنك لا تخاف، بل تعني أنك تفعل الشيء رغم الخوف.","ابدأ بهدف صغير: اقرأ صفحة، تحدث في الصف، جرّب رياضة جديدة. كل نجاح صغير يبني ثقة أكبر.","لا تقارن بدايتك بمنتصف رحلة الآخرين. لكل إنسان توقيته وظروفه وقصته.","تحدث مع نفسك بلطف. بدل أن تقول أنا فاشل، قل: أنا أتعلم، وسأحاول بطريقة أفضل.","اهتم بجسمك: النوم الجيد والماء والرياضة تصنع فرقاً كبيراً في مزاجك وثقتك.","تذكّر دائماً: أنت تستحق الاحترام، وصوتك مهم، ووجودك يضيف شيئاً جميلاً للعالم."],["شجاعة أكبر في المدرسة والحياة","علاقات أصدق وأصح","قدرة على تحقيق أهدافك"],["قد تتأخر النتائج فتحتاج صبراً","المبالغة في إرضاء الآخرين"],"\uD83D\uDCA1 تلميح: كل مساء، اكتب ثلاثة أشياء نجحت فيها اليوم، ولو كانت صغيرة جداً.")]},{title:"عقلك الهادئ",desc:"الهدوء والتركيز واللطف",episodes:[Q("كيف تهدّئ عقلك في دقيقة؟","\uD83C\uDF3F","4 دقائق","عقلك مثل بحيرة: إذا توقفت عن تحريكها، سيصفو ماؤها وترى بوضوح.",["عندما تزدحم الأفكار، جرّب قاعدة 5-4-3-2-1: سمِّ خمسة أشياء تراها، وأربعة تلمسها، وثلاثة تسمعها.","هذا التمرين يعيدك إلى اللحظة الحالية، ويخرجك من دوامة القلق.","التنفس البطيء يخبر جهازك العصبي أنك بأمان. جربه الآن: شهيق أربع ثوانٍ، حبس ثانيتين، زفير ست ثوانٍ.","ابتعد قليلاً عن الهاتف، واشرب ماءً، وانظر إلى السماء أو إلى شجرة. الطبيعة دواء لطيف.","لا تحارب أفكارك، بل لاحظها مثل الغيوم تمر في السماء. الغيوم تذهب، والسماء تبقى.","الهدوء ليس غياب المشاكل، بل قدرتك على أن تبقى لطيفاً رغمها."],["تركيز أفضل في الدراسة","نوم أعمق ومزاج أجمل","قرارات أهدأ وأذكى"],["قد تحتاج إلى تكرار التمرين عدة مرات","صعوبة الهدوء في مكان صاخب"],"\uD83D\uDCA1 تلميح: ضع منبهاً لطيفاً كل ساعتين لتتنفس بعمق وتشرب الماء."),Q("قوة الكلمة الطيبة","\uD83D\uDDE3️","4 دقائق","كلمة واحدة قد تغيّر يوم إنسان كاملاً. لذلك اختر كلماتك كما تختار هدية.",["الكلمات تترك أثراً في الدماغ مثل البصمة. الكلمة الطيبة تُشعر الإنسان بالأمان، والقاسية قد تبقى في قلبه طويلاً.","عندما تمدح صديقك بصدق، يفرز دماغه هرمونات السعادة، وتصبح صداقتكما أقوى.","الاعتذار الصادق شجاعة، وليس ضعفاً. قل: آسف، لم أقصد، وسأنتبه المرة القادمة.","إذا غضبت، توقف قبل أن تتكلم. خذ نفساً، واشرب ماءً، ثم اختر كلماتك بهدوء.","الكلمة الطيبة لا تكلف شيئاً، لكنها تمنح الكثير. جرّب اليوم أن تقول شيئاً جميلاً لثلاثة أشخاص.","تذكّر: لسانك مرآة قلبك. اجعله مرآة نظيفة وجميلة."],["صداقات أقوى وأصدق","بيئة مدرسية ألطف","شعور بالرضا عن نفسك"],["قد يُساء فهم كلمتك أحياناً","صعوبة الاعتذار في البداية"],"\uD83D\uDCA1 تلميح: قبل أن ترسل رسالة وأنت غاضب، انتظر عشر دقائق ثم أعد قراءتها.")]}]},{id:"dreams",title:"علم الأحلام",desc:"لماذا نحلم؟ وما معنى تلك القصص الغريبة التي نراها ونحن نائمون؟",emoji:"\uD83D\uDCAD",grad:"linear-gradient(135deg,#1e1b4b,#6d28d9 50%,#ec4899)",tags:["نوم","أحلام","خيال"],parts:[{title:"لماذا نحلم؟",desc:"مسرح عقلك الليلي",episodes:[Q("لماذا نحلم أثناء النوم؟","\uD83C\uDF19","6 دقائق","عندما تنام، لا ينام دماغك. بل يبدأ في تنظيف الذكريات وترتيبها مثل مكتبة جميلة.",["الحلم يحدث غالباً في مرحلة النوم التي تتحرك فيها العينان بسرعة، وتكون فيها موجات الدماغ نشطة مثل اليقظة.","في هذه المرحلة، يعيد الدماغ ترتيب ما تعلمته في النهار، ويحفظ المهم منه، وينسى غير المهم.","لذلك النوم الجيد يساعدك على تذكر الدروس، بينما السهر الطويل يجعل الحفظ أصعب.","الأحلام قد تكون طريقة الدماغ لتدريبك على مواجهة المخاوف في مكان آمن.","لهذا نحلم أحياناً أننا نطير أو نهرب أو نتحدث مع أشخاص نحبهم. إنه مسرح خيالي بلا حدود.","أجمل ما في الأحلام أنها تذكّرنا أن خيالنا لا ينام أبداً."],["فهم أفضل لعمل الدماغ","نوم أعمق عندما تحترم مواعيده","خيال أوسع وإبداع أكبر"],["السهر يقلل جودة الأحلام","تذكر أحلام مزعجة أحياناً"],"\uD83D\uDCA1 تلميح: ضع دفتراً بجانب سريرك، واكتب حلمك فور استيقاظك قبل أن تنساه."),Q("الكوابيس: لماذا نراها وكيف نتعامل معها؟","\uD83D\uDE28","5 دقائق","الكابوس مخيف، لكنه في الغالب رسالة من عقلك تقول: أنت متوتر، وتحتاج إلى راحة.",["الكوابيس تزداد عند التوتر، أو مشاهدة محتوى مخيف قبل النوم، أو النوم في مكان غير مريح.","عندما تستيقظ من كابوس، تذكّر: لقد انتهى. أنت بأمان الآن، في غرفتك، في بيتك.","تنفس ببطء، اشرب ماءً، وأخبر شخصاً تثق به بما رأيت. الحديث يفكك الخوف.","قبل النوم، اختر قصة لطيفة أو موسيقى هادئة أو دعاءً جميلاً، بدل الشاشات المخيفة.","إذا تكررت الكوابيس كثيراً، تحدث مع أحد والديك أو مع معلم تثق به. طلب المساعدة شجاعة.","لا تدع حلماً سيئاً يسرق يومك الجميل. اليوم الجديد فرصة جديدة."],["تتعلم مواجهة مخاوفك بهدوء","نوم أفضل وعادات صحية","قدرة على طلب المساعدة"],["الخوف من النوم بعد كابوس","الاستيقاظ المتكرر في الليل"],"\uD83D\uDCA1 تلميح: غيّر نهاية الكابوس في خيالك إلى نهاية سعيدة، وستشعر براحة كبيرة.")]},{title:"أسرار النوم",desc:"نومك هو بطلك الخفي",episodes:[Q("النوم: بطلك الخفي","\uD83D\uDE34","5 دقائق","النوم ليس وقتاً ضائعاً، بل هو الوقت الذي يبني فيه جسمك عضلاتك وذاكرتك ومناعتك.",["أثناء النوم العميق، يفرز الجسم هرمون النمو، ويُصلح العضلات، ويقوّي جهاز المناعة.","المراهقون يحتاجون إلى 8 إلى 10 ساعات نوم. أقل من ذلك يجعل التركيز والمزاج أصعب.","الهاتف قبل النوم يرسل ضوءاً أزرق يخدع الدماغ ويظن أن الوقت نهار، فيصعب النوم.","أفضل روتين: ساعة ثابتة للنوم، غرفة هادئة ومظلمة، وكتاب لطيف بدل الشاشة.","إذا لم تستطع النوم، لا تغضب. تنفس بهدوء، وتخيل مكاناً جميلاً تحبه، مثل شاطئ أو حديقة.","نومك الجيد هو سرّ تفوقك وابتسامتك وصحتك. احترمه كما تحترم دراستك."],["تركيز وذاكرة أقوى","مناعة أفضل ومزاج أجمل","طاقة للرياضة والدراسة"],["صعوبة ترك الهاتف ليلاً","الاستيقاظ متعباً عند السهر"],"\uD83D\uDCA1 تلميح: اجعل هاتفك يشحن بعيداً عن سريرك قبل النوم بساعة."),Q("هل تتحقق الأحلام؟","✨","4 دقائق","بعض الأحلام تبدو حقيقية جداً، لدرجة أننا نسأل: هل يمكن أن تتحقق؟",["معظم الأحلام هي مزيج من ذكرياتك ومخاوفك وأمنياتك، وليست تنبؤاً بالمستقبل.","عندما تحلم بشيء ثم يحدث، غالباً لأن عقلك كان يفكر فيه كثيراً، فلاحظته أكثر في الواقع.","أحلامك قد تكشف ما يهمك: إذا حلمت بالنجاح، فهذا يعني أن قلبك يريد أن يجتهد.","بدل أن تسأل هل سيتحقق حلمي؟ اسأل: ماذا سأفعل اليوم ليقترب حلمي؟","العمل الصغير كل يوم أقوى من ألف حلم. اقرأ، تعلّم، جرّب، ولا تخف من الخطأ.","حلمك الحقيقي ليس ما تراه وأنت نائم، بل ما تبنيه وأنت مستيقظ."],["تفهم الفرق بين الخيال والواقع","تحويل الأحلام إلى أهداف عملية","ثقة أكبر في قدراتك"],["القلق من أحلام غريبة","تفسير الأحلام بشكل مبالغ فيه"],"\uD83D\uDCA1 تلميح: حوّل حلماً جميلاً إلى هدف صغير، واكتب أول خطوة ستفعلها اليوم.")]}]},{id:"friend",title:"علم الصداقة",desc:"الصديق الحقيقي كنز، والثقة تُبنى بالصدق والمواقف لا بالكلام فقط.",emoji:"\uD83E\uDD1D",grad:"linear-gradient(135deg,#3f1d00,#b45309 50%,#f59e0b)",tags:["صداقة","ثقة","وفاء"],parts:[{title:"الصديق الحقيقي",desc:"كيف تعرفه وتحافظ عليه",episodes:[Q("علم الصداقة والثقة","\uD83E\uDD0D","6 دقائق","الصداقة الحقيقية ليست بعدد المتابعين، بل بعدد القلوب التي تثق بك وتطمئن إليك.",["الصديق الحقيقي يفرح لفرحك، ويحزن لحزنك، ولا يغار من نجاحك. نجاحك نجاحه.","الثقة تُبنى بالمواقف الصغيرة: أن تحفظ سراً، وأن تفي بوعد، وأن تعتذر عندما تخطئ.","الصداقة الصحية تمنحك حرية أن تكون نفسك، دون خوف من السخرية أو الحكم عليك.","إذا شعرت أن صداقة ما تجعلك حزيناً دائماً أو خائفاً، فمن حقك أن تبتعد بهدوء واحترام.","كن أنت الصديق الذي تتمنى أن تجده: استمع، شجّع، سامح، وكن صادقاً.","الصداقة الجميلة مثل نبتة: تحتاج إلى ماء الاهتمام، وشمس الصدق، وصبر طويل."],["شعور بالانتماء والأمان","دعم في الأوقات الصعبة","ذكريات جميلة تدوم"],["قد تخسر صديقاً بسبب سوء فهم","صعوبة قول لا أحياناً"],"\uD83D\uDCA1 تلميح: أرسل اليوم رسالة لطيفة لصديقك: شكراً لأنك موجود في حياتي."),Q("الحب الحقيقي vs الإعجاب","\uD83D\uDC96","6 دقائق","الإعجاب يقول: أحببت شكلك. والحب الحقيقي يقول: أحترم قلبك وأتمنى لك الخير.",["الإعجاب سريع، يشتعل مع المظهر أو الكلام الجميل، وقد ينطفئ بسرعة عندما تختفي الصورة.","الحب الحقيقي بطيء وهادئ، ينمو مع المعرفة والاحترام والمواقف، ولا يعتمد على المظاهر فقط.","الإعجاب يريد التملك والاهتمام الدائم، أما الحب فيريد الخير والسعادة للطرف الآخر حتى لو كان بعيداً.","في عمرك، أجمل ما تفعله هو أن تبني نفسك: أخلاقك، دراستك، مواهبك، وصداقاتك الطيبة.","الحب الحقيقي يبدأ بحبك لنفسك باحترام، وبحبك لعائلتك وأصدقائك بصدق.","لا تستعجل قلبك. الوقت سيأتي، وستعرف الفرق عندما يمنحك الشعور سلاماً لا قلقاً."],["تفهم مشاعرك دون اندفاع","تحمي قلبك من الخيبة","تبني علاقات ناضجة ومحترمة"],["الخلط بين الإعجاب والحب","الانشغال عن الدراسة والأهداف"],"\uD83D\uDCA1 تلميح: اسأل نفسك: هل هذا الشعور يجعلني أفضل؟ إذا نعم، فهو شعور طيب يستحق الاحترام.")]},{title:"أخلاق القلب",desc:"الاحترام أولاً دائماً",episodes:[Q("الاحترام والأخلاق في المشاعر","\uD83D\uDEE1️","5 دقائق","أجمل قلب هو القلب الذي يحب دون أن يؤذي، ويعجب دون أن يزعج.",["الاحترام يعني أن تحترم حدود الآخرين: لا ترسل رسائل مزعجة، ولا تلاحق أحداً، ولا تنشر أسراراً.","إذا قال لك شخص لا، فهذا جواب كامل. احترمه وامضِ بكرامة. كرامتك أغلى من أي شعور.","لا تستخدم المشاعر للضغط أو الابتزاز. الحب لا يهدد، ولا يخيف، ولا يفرض.","المشاعر الطيبة تُحفظ في القلب، أو تُقال لأهل الثقة باحترام، وليس أمام الجميع.","الأخلاق هي التي تحوّل الإعجاب إلى شيء جميل، وتمنع الشعور من أن يتحول إلى إزعاج.","تذكّر: الإنسان الراقي يُعرف عندما يحب، وعندما يُرفض، وعندما يغضب."],["تحافظ على كرامتك وكرامة الآخرين","تبني سمعة طيبة ومحترمة","علاقات نظيفة وآمنة"],["قد تشعر بالألم عند وضع حدود","صعوبة فهم مشاعر الآخرين أحياناً"],"\uD83D\uDCA1 تلميح: إذا شعرت بالحيرة، تحدث مع والدتك أو أبيك أو معلم تثق به."),Q("كيف تكون صديقاً رائعاً؟","\uD83C\uDF3B","4 دقائق","لا تحتاج إلى مال كثير لتكون صديقاً رائعاً. تحتاج إلى قلب يستمع.",["استمع أكثر مما تتكلم. أحياناً يحتاج صديقك إلى أذن صاغية فقط، لا إلى نصيحة.","تذكّر التفاصيل الصغيرة: امتحانه، مباراته، يومه الصعب. الاهتمام الصغير يصنع فرقاً كبيراً.","دافع عن صديقك في غيابه، ولا تنقل كلاماً يجرحه. الوفاء يُعرف عندما لا يكون موجوداً.","شارك الفرح: هنّئه على نجاحه من قلبك، واحتفل معه. الصديق الحقيقي لا يغار.","اعتذر عندما تخطئ، وسامح عندما يعتذر. الصداقة لا تعيش مع الكبرياء.","كن أنت النور الذي تتمنى أن تجده في حياتك."],["صداقات تدوم سنوات طويلة","شعور بالسعادة والعطاء","سمعة طيبة بين زملائك"],["قد يخذلك بعض الناس رغم وفائك","الحاجة إلى التوازن بين العطاء والراحة"],"\uD83D\uDCA1 تلميح: كل أسبوع، افعل شيئاً لطيفاً لصديق دون أن يطلب منك.")]}]},{id:"sun",title:"علم الشمس والطاقة",desc:"القمر يهمس، والشمس تمنح الحياة. اكتشف طاقتهما وتأثيرهما عليك.",emoji:"☀️",grad:"linear-gradient(135deg,#431407,#ea580c 50%,#facc15)",tags:["شمس","قمر","طاقة"],parts:[{title:"القمر",desc:"رفيق الليالي الهادئة",episodes:[Q("القمر وتأثيره علينا","\uD83C\uDF19","6 دقائق","القمر ليس مصباحاً في السماء فقط، بل رفيق الأرض الذي يحرك البحار وينظم الليل.",["القمر يدور حول الأرض، وجاذبيته تسحب مياه البحار، فيصنع المد والجزر. لولا القمر لكان البحر مختلفاً تماماً.","ضوء القمر ليس ضوءه، بل انعكاس لضوء الشمس على سطحه الرمادي. إنه مرآة فضائية جميلة.","القمر يثبّت محور دوران الأرض، مما يجعل الفصول منتظمة والحياة أكثر استقراراً.","كثير من الناس يشعرون بالهدوء عند النظر إلى القمر، لأن منظره يذكّرهم بالسكينة والتأمل.","العلماء يقولون إن تأثير القمر على النوم والمزاج محدود، لكن تأثير جماله على قلوبنا كبير جداً.","في الليلة القادمة، ارفع رأسك وانظر إليه، وقل: شكراً أيها الرفيق الصامت."],["تفهم المد والجزر والفصول","شعور بالهدوء والتأمل","حبّ علم الفلك"],["الخرافات الكثيرة حول القمر","الخلط بين العلم والأساطير"],"\uD83D\uDCA1 تلميح: تابع أطوار القمر لمدة شهر، وارسمه كل ليلة في دفترك."),Q("أطوار القمر: لماذا يتغير شكله؟","\uD83C\uDF12","5 دقائق","القمر لا يتغير حقاً، بل يتغير ما نراه منه. إنها لعبة الضوء والظل.",["القمر يدور حول الأرض في حوالي 29 يوماً، وخلال هذه الرحلة تتغير الزاوية بين الشمس والأرض والقمر.","عندما يكون القمر بين الأرض والشمس، نرى وجهه المظلم، فيسمى المحاق.","وعندما تكون الأرض بين الشمس والقمر، نرى وجهه مضاءً كاملاً، فيسمى البدر.","بينهما نرى الهلال والتربيع والأحدب. كل طور حكاية هندسية جميلة.","هذه الأطوار كانت تُستخدم قديماً لمعرفة الشهور ومواعيد الزراعة والسفر.","القمر يعلمنا درساً: حتى عندما لا نرى كله، فهو موجود كاملاً في السماء."],["تفهم حركة القمر والشهور","قدرة على رصد السماء","ربط العلم بالحياة اليومية"],["صعوبة تخيّل الزوايا الفضائية","الخلط بين الكسوف وأطوار القمر"],"\uD83D\uDCA1 تلميح: استخدم مصباحاً وكرة لتمثيل الشمس والأرض والقمر، وستفهم الأطوار بسرعة.")]},{title:"الشمس والطاقة",desc:"مصدر الحياة والدفء",episodes:[Q("علم الطاقة والشمس","⚡","6 دقائق","الشمس هي قلب نظامنا، وبدونها لن تكون هناك حياة ولا دفء ولا طعام.",["الشمس نجم متوسط الحجم، لكنها تبدو كبيرة لأنها قريبة منا نسبياً: حوالي 150 مليون كيلومتر.","داخلها يحدث اندماج نووي يحول الهيدروجين إلى هيليوم، ويطلق طاقة هائلة تصل إلينا كضوء وحرارة.","النباتات تستخدم ضوء الشمس لصنع غذائها، ونحن نأكل النباتات أو الحيوانات التي تأكلها. لذلك الشمس تغذي العالم كله.","ضوء الشمس يساعد جسمنا على صنع فيتامين د، الذي يقوّي العظام والمزاج. لذلك المشي في الشمس الصباحية مفيد.","لكن الشمس القوية في الظهيرة قد تحرق الجلد، لذلك نحتاج إلى قبعة وماء وظل.","الشمس تعلمنا: العطاء الحقيقي هو أن تمنح النور دون أن تنتظر مقابلاً."],["تفهم مصدر الطاقة والحياة","عادات صحية في الشمس","حبّ البيئة والطبيعة"],["التعرض الطويل للشمس يضر الجلد","النوم تحت الشمس مباشرة خطر"],"\uD83D\uDCA1 تلميح: امشِ 15 دقيقة في شمس الصباح، وستشعر بنشاط وسعادة طوال اليوم."),Q("الشمس والمزاج: لماذا نحب الصباح؟","\uD83C\uDF05","5 دقائق","الصباح ليس مجرد وقت، بل طاقة جديدة. والشمس هي منبه الطبيعة ال فة ذوقنا وأفكارنا.","\uD83C\uDFAD"),k("علم اجتماع الإعلام","يدرس الصحافة والتلفاز والأخبار، وكيف تؤثر الصور والكلمات في آرائنا.","\uD83D\uDCFA"),k("علم اجتماع السوشل ميديا","يدرس مواقع التواصل: كيف ننشر ونعلق ونتابع، وما أثرها على مزاجنا وعلاقاتنا.","\uD83D\uDCF1"),k("علم اجتماع الموضة","يدرس الملابس والذوق، ولماذا نتبع صيحات معينة، وكيف نعبّر عن أنفسنا بلباس محترم.","\uD83D\uDC57"),k("علم اجتماع الرياضة","يدرس حب المباريات والفرق، وكيف تجمع الرياضة الناس على الفرح والاحترام.","⚽")],"علم المجتمع"),we("قضايا كبرى","أسئلة تؤثر في العالم كله",[k("علم اجتماع الهجرة","يدرس انتقال الناس بين البلدان بحثاً عن عمل أو أمان أو مستقبل أفضل.","\uD83E\uDDF3"),k("علم اجتماع الفقر والغنى","يدرس الفوارق بين الناس، وكيف نبني مجتمعاً أعدل وأرحم.","⚖️"),k("علم اجتماع الجندر - الرجل والمرأة","يدرس أدوار الرجل والمرأة في المجتمع، ويدعو إلى الاحترام والعدل والتكامل بينهما.","\uD83D\uDC6B"),k("علم اجتماع العولمة","يدرس كيف أصبح العالم قرية واحدة، تتشابه فيها الأفكار والسلع والثقافات.","\uD83C\uDF0D"),k("علم اجتماع الحروب","يدرس أسباب الحروب وألمها، ولماذا السلام والعدل هما الطريق الأجمل.","\uD83D\uDD4A️"),k("علم اجتماع الكوارث","يدرس الزلازل والفيضانات والأزمات، وكيف يتضامن الناس ويعيدون البناء.","\uD83C\uDF0A"),k("علم اجتماع المعرفة","يدرس كيف ننتج العلم والأفكار، ومن يقرر ما هو صحيح ومهم.","\uD83D\uDCA1"),k("علم اجتماع اللغة","يدرس كيف تشكّل اللغة تفكيرنا وعلاقاتنا، ولماذا نحب لهجاتنا وكلماتنا.","\uD83D\uDDE3️")],"علم المجتمع")],zh=[we("أنواع الحب اليونانية الأصلية - 8","ثماني كلمات قديمة لثماني مشاعر",[k("إيروس - حب الشهوة والجسد","انجذاب ومودة نحو شخص، يبقى جميلاً فقط حين يلتزم بالاحترام والحدود والكرامة.","\uD83D\uDD25"),k("فيليا - حب الصداقة","حب الأصدقاء الصادق: وفاء واستماع وفرح لنجاح الآخر، دون انتظار مقابل.","\uD83E\uDD1D"),k("ستورجي - حب العائلة","حب العائلة الدافئ: أب وأم وإخوة يجمعهم الحنان والمسؤولية والذكريات.","\uD83C\uDFE0"),k("أغابي - حب التضحية بدون مقابل","حب يعطي دون أن ينتظر شيئاً: مساعدة وصدقة ولطف يخرج من قلب كريم.","\uD83D\uDC9B"),k("لودوس - حب اللعب والمرح","حب خفيف ومرح: ضحك ولعب ومزاح محترم يجعل الحياة أجمل.","\uD83C\uDF88"),k("براغما - حب العقل والتفاهم","حب ينمو بالتفاهم والصبر والاختيار الواعي، لا بالاندفاع وحده.","\uD83E\uDDE0"),k("فيلاوتيا - حب الذات","حب الذات الصحي: أن تحترم نفسك وتعتني بها، دون أن تؤذي الآخرين أو تتكبر عليهم.","\uD83E\uDE9E"),k("مينيا - حب الهوس والتملك","تعلق شديد يتحول إلى مراقبة وغيرة وخوف. يحتاج إلى هدوء وحدود ومساعدة موثوقة.","⚠️")],"علم الحب"),we("علم النفس الحديث","أنواع الحب كما نعيشها اليوم",[k("الحب الرومانسي","مشاعر رومانسية رقيقة تجمع بين المودة والإعجاب والرغبة في القرب، داخل احترام وحدود واضحة.","\uD83D\uDC8C"),k("الحب الأفلاطوني - بدون جسد","حب يقوم على الروح والفكر والصداقة العميقة، ويحترم الحدود ولا يطلب أكثر منها.","\uD83C\uDF38"),k("الحب من أول نظرة","انجذاب سريع وقوي عند أول لقاء، قد يكون بداية إعجاب، لكنه يحتاج إلى وقت ليثبت صدقه.","\uD83D\uDC40"),k("الحب الأحادي - شخص واحد","اختيار أن يركّز القلب على شخص واحد بوفاء واحترام ومسؤولية.","\uD83D\uDC8D"),k("الحب المتعدد","تعدد المشاعر أو العلاقات، وهو موضوع حساس يثير أسئلة عن الوفاء والصدق والحدود.","\uD83D\uDCAD"),k("الحب السري","مشاعر مخفية لا تُقال، قد تكون مؤلمة لأن صاحبها يعيشها وحده دون أن يشاركها.","\uD83E\uDD2B"),k("الحب الممنوع","مشاعر تجاه شخص لا يسمح الظرف أو القيم بالاقتراب منه، وتحتاج إلى ضبط النفس والاحترام.","\uD83D\uDEAB"),k("الحب الافتراضي - عبر الإنترنت","مشاعر تنشأ عبر الشاشات والرسائل، قد تكون صادقة، لكنها تحتاج إلى حذر وصدق وتحقق.","\uD83D\uDCF1"),k("حب الذات النرجسي","إعجاب مبالغ فيه بالنفس يجعل صاحبه يرى الآخرين أقل منه، ويضعف علاقاته.","\uD83E\uDE9E"),k("حب الذات الصحي","أن تقبل نفسك، وتصلح أخطاءك، وتعتني بصحتك ودراستك وأخلاقك دون غرور.","\uD83C\uDF31"),k("حب الوطن","حب الأرض والبلد والناس، يظهر بالعمل والصدق وحماية المكان الذي نعيش فيه.","\uD83C\uDDE9\uD83C\uDDFF"),k("حب الطبيعة","حب الأشجار والبحر والسماء، يدفعنا إلى التأمل وحماية البيئة والشكر على الجمال.","\uD83C\uDF3F"),k("حب الحيوانات","رحمة بالحيوانات والعناية بها، لأن اللطف لا يتوقف عند الإنسان فقط.","\uD83D\uDC31"),k("حب المال والشهرة","حب المال والشهرة قد يمنح متعة سريعة، لكنه لا يمنح سلام القلب إذا غاب عنه القناعة.","\uD83D\uDCB0"),k("حب الفن","حب الرسم والموسيقى والقصص، يمنح القلب لغة جميلة للتعبير عن المشاعر.","\uD83C\uDFA8")],"علم الحب"),we("أنواع التعلق في الحب - 4","كيف نتعلق بمن نحب؟",[k("التعلق الآمن","شعور بالاطمئنان: تثق بالآخر، وتستطيع أن تكون قريباً منه دون خوف دائم.","\uD83E\uDD0D"),k("التعلق القلق - يخاف يخسرو","خوف دائم من الفقد، يجعل صاحبه يبحث عن الطمأنة كثيراً، ويحتاج إلى هدوء وثقة.","\uD83D\uDE1F"),k("التعلق المتجنب - يهرب من القرب","ميل إلى الابتعاد عندما يقترب الآخر، خوفاً من الالتزام أو الألم.","\uD83C\uDFC3"),k("التعلق الفوضوي - يحب ويخاف في نفس الوقت","مشاعر متضاربة: رغبة في القرب وخوف منه في نفس الوقت، وتحتاج إلى صبر ومساعدة.","\uD83C\uDF2A️")],"علم الحب"),we("مراحل الحب علمياً - 5","رحلة المشاعر خطوة بخطوة",[k("الانجذاب","أول شرارة: انتباه وإعجاب بشيء جميل في الشخص أو أخلاقه أو كلامه.","✨"),k("الإعجاب","مرحلة نرى فيها صفات جميلة أكثر، ونتمنى أن نعرف الشخص أكثر باحترام.","\uD83D\uDE0A"),k("التعلق","مرحلة القرب والثقة: نشعر أن وجود الآخر يمنحنا أماناً واطمئناناً.","\uD83E\uDD1D"),k("الالتزام","قرار واعي: أن نحترم العلاقة، ونحافظ عليها بالصدق والوفاء والمسؤولية.","\uD83D\uDC8D"),k("الحب العميق أو الانفصال","نهاية الرحلة: إما حب عميق ينمو بالاحترام، أو انفصال هادئ يحفظ الكرامة.","\uD83C\uDF05")],"علم الحب"),we("هرمونات وكيمياء الحب - 6","ما الذي يحدث داخل الجسم؟",[k("الدوبامين - الإدمان والحماس","هرمون التحفيز: يمنحنا حماساً وسعادة حين يحدث شيء جميل، ويجعلنا نريد تكراره.","⚡"),k("الأوكسيتوسين - الثقة والحضن","هرمون القرب والثقة: يظهر مع الصداقة الصادقة والعناق الآمن والكلام الطيب.","\uD83E\uDD17"),k("السيروتونين - التفكير الزائد","مادة في الدماغ ترتبط بالمزاج والتفكير، وقد تجعلنا نفكر كثيراً في من نحب.","\uD83D\uDCAD"),k("الأدرينالين - خفقان القلب والتوتر","هرمون التوتر الجميل: يزيد خفقان القلب قبل لقاء مهم، ويهدأ بالتنفس والهدوء.","\uD83D\uDC93"),k("التستوستيرون - الرغبة","هرمون يؤثر في الطاقة والرغبة والثقة، ويحتاج إلى توازن وأخلاق وحدود محترمة.","\uD83D\uDD25"),k("الإستروجين - الأنوثة والجاذبية","هرمون يؤثر في المزاج والطاقة والحيوية، ويتغير بشكل طبيعي مع مراحل الحياة.","\uD83C\uDF38")],"علم الحب"),we("أنواع جديدة من المطوّر","مشاعر لم يتحدث عنها الكثيرون",[k("حب الخيال - تحب شخص ما تعرفوش حقيقة","حب لصورة في الخيال أكثر من حب لشخص حقيقي، يحتاج إلى أن نميّز بين الحلم والواقع.","\uD83D\uDCAD"),k("حب الصدمة - تتعلق باللي آذاك","تعلق مؤلم بمن آذانا، يحتاج إلى وعي وشجاعة ومساعدة من شخص موثوق.","\uD83D\uDC94"),k("حب الإنقاذ - تحب تصلح الناس","رغبة في إصلاح الآخرين ومساعدتهم، جميلة إذا كانت بحدود، ومتعبة إذا أهملنا أنفسنا.","\uD83D\uDEDF"),k("حب المرآة - تحب اللي يشبهك","انجذاب لمن يشبهنا في الأفكار والذوق، لأن التشابه يمنحنا شعوراً بالأمان.","\uD83E\uDE9E"),k("حب النقيض - تحب اللي عكسك تماماً","انجذاب لمن يختلف عنا تماماً، لأن الاختلاف يثير الفضول ويعلّمنا أشياء جديدة.","\uD83E\uDDF2"),k("حب الكراهية - تحب وتكره في نفس الوقت","مشاعر مختلطة: حب وغضب معاً، تحتاج إلى هدوء وصدق لفهم سببها.","⚡"),k("حب ما بعد الفراق","مشاعر تبقى بعد الفراق، تتحول مع الوقت إلى ذكرى ودروس ونضج.","\uD83C\uDF05"),k("حب بلا لقاء","حب يعيش في القلب والرسائل والذكريات، دون أن يلتقي الطرفان، ويحتاج إلى واقعية وهدوء.","\uD83D\uDC8C")],"علم الحب")],gt=[{id:"human",title:"علم الإنسان - كل أنواعه",desc:"رحلة في جسد الإنسان وثقافته ولغته وآثاره، من التطور إلى الإنترنت.",emoji:"\uD83E\uDDCD",grad:"linear-gradient(135deg,#0B2A4A,#2B6CB0 55%,#4DA6FF)",tags:["أنثروبولوجيا","ثقافة","تاريخ"],parts:Th},{id:"society",title:"علم المجتمع - كل أنواعه",desc:"الأسرة والاقتصاد والمدينة والثقافة: كيف نعيش معاً ونبني مجتمعاً أفضل.",emoji:"\uD83C\uDFD8️",grad:"linear-gradient(135deg,#2A125E,#6D28D9 55%,#A78BFA)",tags:["مجتمع","أسرة","ثقافة"],parts:_h},{id:"love",title:"علم الحب - كل أنواعه بالكامل",desc:"من اليونان إلى علم النفس الحديث: أنواع الحب والتعلق والمراحل والهرمونات، باحترام وعلم.",emoji:"❤️",grad:"linear-gradient(135deg,#5B1030,#DB2777 55%,#FF7AA8)",tags:["مشاعر","قلب","احترام"],parts:zh}],gf={ar:{home:"الرئيسية",index:"الفهرس",settings:"الإعدادات",heroTitle:"اكتشف أسرار الإنسان والمجتمع وال
